<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH3D Auto Tool</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🐉</span>
                <h1>HH3D Auto Tool</h1>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span class="status-text">Đang dừng</span>
            </div>
            <div class="domain-indicator" id="domainIndicator" title="Domain tự động phát hiện">
                <span class="domain-icon">🌐</span>
                <span class="domain-text" id="domainText">Đang tìm...</span>
            </div>
        </div>

        <!-- Main Content - 2 Columns -->
        <div class="main-content">
            <!-- Left Column -->
            <div class="left-column">
                <!-- Workers Toggle -->
                <div class="section workers-section">
                    <div class="section-header">
                        <span class="section-icon">⚙️</span>
                        <span>Workers</span>
                        <label class="toggle-all">
                            <input type="checkbox" id="toggleAll" checked>
                            <span>Tất cả</span>
                        </label>
                    </div>

                    <div class="workers-grid">
                        <label class="worker-item" title="Phúc Lợi Đường - Tự động mở rương phúc lợi">
                            <input type="checkbox" name="worker" value="chest" checked>
                            <span class="worker-icon">🎁</span>
                            <span class="worker-name">Phúc Lợi</span>
                        </label>

                        <label class="worker-item" title="Boss Hoang Vực - Tự động đánh boss hoang vực">
                            <input type="checkbox" name="worker" value="boss" checked>
                            <span class="worker-icon">🛡️</span>
                            <span class="worker-name">Boss Hoang Vực</span>
                        </label>

                        <label class="worker-item" title="Boss Tông Môn - Tự động đánh boss tông môn">
                            <input type="checkbox" name="worker" value="bossTongMon" checked>
                            <span class="worker-icon">👹</span>
                            <span class="worker-name">Boss Tông Môn</span>
                        </label>

                        <label class="worker-item" title="Vòng Quay Phúc Vận - Tự động quay vòng quay">
                            <input type="checkbox" name="worker" value="spin" checked>
                            <span class="worker-icon">🎡</span>
                            <span class="worker-name">Vòng Quay</span>
                        </label>

                        <label class="worker-item" title="Thí Luyện Tông Môn - Tự động mở rương TLTM">
                            <input type="checkbox" name="worker" value="tltm" checked>
                            <span class="worker-icon">💎</span>
                            <span class="worker-name">TLTM</span>
                        </label>


                        <label class="worker-item" title="Vấn Đáp - Tự động trả lời câu hỏi">
                            <input type="checkbox" name="worker" value="vanDap" checked>
                            <span class="worker-icon">❓</span>
                            <span class="worker-name">Vấn Đáp</span>
                        </label>

                        <label class="worker-item" title="Tế Lễ Tông Môn - Tự động tế lễ">
                            <input type="checkbox" name="worker" value="teLe" checked>
                            <span class="worker-icon">🙏</span>
                            <span class="worker-name">Tế Lễ</span>
                        </label>

                        <label class="worker-item" title="Thưởng Hoạt Động Ngày - Tự động nhận thưởng">
                            <input type="checkbox" name="worker" value="dailyReward" checked>
                            <span class="worker-icon">🏆</span>
                            <span class="worker-name">Thưởng Ngày</span>
                        </label>

                        <label class="worker-item" title="Khoáng Mạch - Tự động vào mỏ và claim thưởng">
                            <input type="checkbox" name="worker" value="mining">
                            <span class="worker-icon">⛏️</span>
                            <span class="worker-name">Khoáng Mạch</span>
                        </label>

                        <label class="worker-item" title="Luyện Đan - Tự động luyện đan và Điều Hỏa">
                            <input type="checkbox" name="worker" value="luyenDan">
                            <span class="worker-icon">🧪</span>
                            <span class="worker-name">Luyện Đan</span>
                        </label>

                        <label class="worker-item" title="Mê Cung - Tự động tham gia chiến đấu và nhận rương">
                            <input type="checkbox" name="worker" value="meCung">
                            <span class="worker-icon">⚔️</span>
                            <span class="worker-name">Mê Cung</span>
                        </label>
                    </div>
                </div>

                <!-- Mining Config -->
                <div class="section mining-section" id="miningSection">
                    <div class="section-header">
                        <span class="section-icon">⛏️</span>
                        <span>Cấu hình Khoáng Mạch</span>
                    </div>
                    <div class="mining-config">
                        <div class="config-row">
                            <label>Loại mỏ:</label>
                            <select id="mineType">
                                <option value="gold">🥇 Thượng (Vàng)</option>
                                <option value="silver" selected>🥈 Trung (Bạc)</option>
                                <option value="copper">🥉 Hạ (Đồng)</option>
                            </select>
                            <button class="btn btn-small btn-check" id="checkMinesBtn">🔍 Check</button>
                        </div>
                        <div class="config-row">
                            <label>Chọn mỏ:</label>
                            <select id="mineSelect" disabled>
                                <option value="">-- Bấm Check để load --</option>
                            </select>
                        </div>
                        <div class="config-row hint" id="mineHint">
                            💡 Bấm Check để xem danh sách mỏ
                        </div>
                    </div>
                </div>

                <!-- Me Cung Config -->
                <div class="section mecung-section" id="mecungSection" style="border: 1px solid rgba(124, 58, 237, 0.3); background: rgba(124, 58, 237, 0.05);">
                    <div class="section-header">
                        <span class="section-icon">⚔️</span>
                        <span>Cấu hình Mê Cung</span>
                    </div>
                    <div class="mecung-config" style="display: flex; flex-direction: column; gap: 10px;">
                        <div class="config-row">
                            <label style="font-size: 12px; color: var(--text-secondary); min-width: 90px; flex-shrink: 0;">Số người min:</label>
                            <select id="mcMinPlayers" style="flex: 1; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 12px; outline: none;">
                                <option value="1">1 Người (Solo)</option>
                                <option value="2">2 Người</option>
                                <option value="3">3 Người</option>
                                <option value="4">4 Người</option>
                                <option value="5" selected>5 Người (Tối đa)</option>
                            </select>
                        </div>
                        <div class="config-row">
                            <label style="font-size: 12px; color: var(--text-secondary); min-width: 90px; flex-shrink: 0;">Vai trò:</label>
                            <select id="mcRole" style="flex: 1; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 12px; outline: none;">
                                <option value="host">Chủ Phòng (Chỉ Lập phòng)</option>
                                <option value="member" selected>Thành Viên (Chỉ Vào phòng)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Luyen Dan Config -->
                <div class="section luyen-dan-section" id="luyenDanSection" style="border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); display: none;">
                    <div class="section-header">
                        <span class="section-icon">🧪</span>
                        <span>Cấu hình Luyện Đan</span>
                    </div>
                    <div class="luyen-dan-config" style="display: flex; flex-direction: column; gap: 10px;">
                        <div class="config-row">
                            <label style="font-size: 12px; color: var(--text-secondary); min-width: 90px; flex-shrink: 0;">Luyện phẩm:</label>
                            <select id="ldTargetTier" style="flex: 1; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 12px; outline: none;">
                                <option value="auto" selected>Tự động chọn cao nhất</option>
                                <option value="cuc">Cực Phẩm</option>
                                <option value="thuong">Thượng Phẩm</option>
                                <option value="trung">Trung Phẩm</option>
                                <option value="ha">Hạ Phẩm</option>
                            </select>
                        </div>
                        <div class="config-row" style="align-items: center; justify-content: flex-start; gap: 8px;">
                            <input type="checkbox" id="ldAutoDecompose" style="margin: 0; width: 16px; height: 16px; cursor: pointer;">
                            <label for="ldAutoDecompose" style="font-size: 12px; color: var(--text-secondary); cursor: pointer; user-select: none;">Tự phân giải khi túi đầy</label>
                        </div>
                        <div class="config-row" id="ldDecomposeTierRow" style="display: none;">
                            <label style="font-size: 12px; color: var(--text-secondary); min-width: 90px; flex-shrink: 0;">Phẩm phân giải:</label>
                            <select id="ldDecomposeTier" style="flex: 1; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 12px; outline: none;">
                                <option value="ha" selected>Hạ Phẩm</option>
                                <option value="trung">Trung Phẩm</option>
                                <option value="thuong">Thượng Phẩm</option>
                                <option value="cuc">Cực Phẩm</option>
                            </select>
                        </div>
                        <div class="config-row" id="ldDecomposeStarsRow" style="display: none;">
                            <label style="font-size: 12px; color: var(--text-secondary); min-width: 90px; flex-shrink: 0;">Sao phân giải:</label>
                            <select id="ldDecomposeStars" style="flex: 1; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 12px; outline: none;">
                                <option value="1-2" selected>1★ và 2★</option>
                                <option value="1">Chỉ 1★</option>
                                <option value="2">Chỉ 2★</option>
                                <option value="3">Chỉ 3★</option>
                                <option value="1-3">1★ đến 3★</option>
                                <option value="all">Tất cả (1★ đến 4★)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="right-column">
                <!-- Control Buttons -->
                <div class="section controls-section">
                    <button class="btn btn-primary btn-large" id="startBtn">
                        <span class="btn-icon">▶️</span>
                        Bắt đầu
                    </button>
                    <button class="btn btn-danger btn-large" id="stopBtn" disabled>
                        <span class="btn-icon">⏹️</span>
                        Dừng lại
                    </button>
                </div>

                <!-- Log Section -->
                <div class="section log-section">
                    <div class="section-header">
                        <span class="section-icon">📋</span>
                        <span>Logs</span>
                        <button class="btn btn-small" id="clearLogBtn">Xóa</button>
                    </div>
                    <div class="log-container" id="logContainer">
                        <p class="log-empty">Chưa có log nào...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>Doãn Đại Hiệp</span>
            <span class="separator">|</span>
            <span id="currentTime"></span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
